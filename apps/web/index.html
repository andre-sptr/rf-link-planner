<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var stored = localStorage.getItem('linksight-color-scheme');
        if (stored === 'light' || stored === 'dark') {
          document
            .querySelector('meta[name="color-scheme"]')
            .setAttribute('content', stored);
        }
      } catch (_e) {}
    </script>
    <title>LinkSight RF — RF Link Budget &amp; Fresnel Zone Planner</title>
    <meta
      name="description"
      content="Interactive RF link budget, single-repeater relay, SRTM terrain elevation, and 1st Fresnel zone clearance planner with PDF site survey export."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
